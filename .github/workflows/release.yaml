name: release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish; defaults to the tag on the checked-out commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Get GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: get_token
        with:
          client-id: ${{ secrets.HOSTINGERBOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.HOSTINGERBOT_PUBLIC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api-cli
            homebrew-tap
          permission-contents: write

      - name: Repo checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
